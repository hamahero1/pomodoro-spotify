# Nginx reverse proxy for Pomodoro Spotify, in front of Gunicorn (127.0.0.1:8000).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/pomodoro-spotify
#   sudo ln -s /etc/nginx/sites-available/pomodoro-spotify /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see DEPLOYMENT.md) — it edits this file in place to add
# the TLS server block, so the plain-HTTP block below is deliberately
# minimal; certbot fills in the rest.
#
# Replace YOUR_DOMAIN before installing.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
